<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星星扭蛋機</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('bg.png'); 
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;    
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* ─── 🛠️ 核心微調：加大 star5.png 按鈕 ─── */
        .secret-star-btn {
            width: 100px; /* 由 45px 加大到 65px，望落去更顯眼、比例更好看 */
            height: auto;
            cursor: pointer;
            margin-bottom: 8px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2));
            transition: transform 0.2s ease;
            animation: floatBtn 2s ease-in-out infinite alternate;
        }

        .secret-star-btn:hover {
            transform: scale(1.15) rotate(15deg);
        }

        @keyframes floatBtn {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        /* 扭蛋機外殼 */
        .gachapon-machine {
            width: 280px;
            height: 400px;
            background-color: #AEE2E6; 
            border-radius: 20px 20px 10px 10px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 5px solid #4A6B70; 
        }

        /* 櫥窗內改成透明背景 */
        .showcase {
            width: 240px;
            height: 200px;
            background-color: rgba(255, 255, 255, 0.4); 
            border: 5px solid #4A6B70;
            border-radius: 15px;
            margin: 15px auto 0;
            position: relative;
            overflow: hidden;
            background-image: radial-gradient(circle, rgba(255,255,255,0.8) 20%, transparent 20%);
            background-size: 20px 20px;
        }

        .star-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .star-wrapper {
            position: absolute;
            width: 34px;
            height: 34px;
            transform: rotate(var(--base-rot)); 
            transition: transform 0.3s ease, left 0.3s ease, top 0.3s ease;
        }

        .star-img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.12));
            animation: idleFloatOnly 3s ease-in-out infinite alternate;
        }

        @keyframes idleFloatOnly {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* 每粒個別亂滾軌跡 */
        @keyframes gachaRollIndividual {
            0% { transform: translate(0, 0) rotate(var(--base-rot)) scale(1); }
            25% { transform: translate(var(--shake-x1), var(--shake-y1)) rotate(calc(var(--base-rot) + var(--roll-deg1))) scale(1.1); }
            50% { transform: translate(var(--shake-x2), var(--shake-y2)) rotate(calc(var(--base-rot) + var(--roll-deg2))) scale(0.9); }
            75% { transform: translate(var(--shake-x3), var(--shake-y3)) rotate(calc(var(--base-rot) + var(--roll-deg3))) scale(1.05); }
            100% { transform: translate(0, 0) rotate(calc(var(--base-rot) + 360deg)) scale(1); }
        }

        .shaking .star-wrapper {
            animation: gachaRollIndividual var(--speed) linear infinite;
            animation-delay: var(--delay);
        }
        .shaking .star-img {
            animation: none; 
        }

        @keyframes machineShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 2px) rotate(-1deg); }
            40% { transform: translate(3px, -1px) rotate(1deg); }
            60% { transform: translate(-2px, -2px) rotate(-1deg); }
            80% { transform: translate(2px, 2px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .shaking {
            animation: machineShake 0.15s linear infinite;
        }

        .control-panel {
            width: 100%;
            position: absolute;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .knob {
            width: 60px;
            height: 60px;
            background-color: #FFF;
            border: 4px solid #4A6B70;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: transform 0.5s ease;
            box-shadow: 0 4px 0 #B2C7C9;
        }

        .knob::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 12px;
            background-color: #4A6B70;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            border-radius: 4px;
        }

        .knob.rotate {
            transform: rotate(360deg);
        }

        .exit-hole {
            width: 70px;
            height: 50px;
            background-color: #4A6B70;
            border-radius: 15px 15px 0 0;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .gacha-ball {
            width: 42px;                     
            height: auto;
            position: absolute;
            top: -50px;                     
            left: 14px;                     
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            transform: rotate(0deg);
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.5s ease;
        }

        .gacha-ball.drop {
            top: 6px;                       
            transform: rotate(115deg);       
        }

        /* 通用彈窗樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: #FFF;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 80%;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .result-star {
            width: 80px;      
            height: auto;
            animation: spin 2s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .result-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .close-btn, .submit-btn {
            background-color: #AEE2E6;
            color: #333;
            border: 2px solid #4A6B70;
            padding: 8px 25px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #4A6B70;
            font-weight: bold;
            margin: 5px;
        }

        .close-btn:active, .submit-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #4A6B70;
        }

        .pwd-input {
            width: 80%;
            padding: 10px;
            font-size: 18px;
            border: 3px solid #4A6B70;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            letter-spacing: 2px;
        }

        .letter-content {
            background-color: #FFFDF2; 
            border: 2px dashed #4A6B70;
            padding: 25px;
            border-radius: 10px;
            text-align: left; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            max-width: 320px;
            font-family: 'Georgia', serif;
            color: #444;
            line-height: 1.6;
        }

        .letter-title {
            font-size: 22px;
            font-weight: bold;
            color: #4A6B70;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #AEE2E6;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 這裡幫你把 src 改成了 star5.png 並且套用了加大後的 Class -->
    <img src="star5.png" class="secret-star-btn" onclick="openQuestionWindow()" alt="secret-star">

    <div class="gachapon-machine" id="machine">
        <div class="showcase">
            <div class="star-container" id="starContainer"></div>
        </div>

        <div class="control-panel">
            <div class="knob" id="knob" onclick="drawGacha()"></div>
            
            <div class="exit-hole">
                <img src="star.png" class="gacha-ball" id="gachaBall" alt="gacha-star">
            </div>
        </div>
    </div>
</div>

<!-- 彈窗 1：扭蛋結果彈窗 -->
<div class="modal" id="resultModal">
    <div class="modal-content">
        <img src="star.png" class="result-star" id="resultImg" alt="star">
        <div class="result-text" id="resultText">恭喜獲得：???</div>
        <button class="close-btn" onclick="closeModal('resultModal')">太棒了！</button>
    </div>
</div>

<!-- 彈窗 2：密碼詢問彈窗 -->
<div class="modal" id="questionModal">
    <div class="modal-content">
        <div class="result-text">🔒 請輸入解鎖密碼：</div>
        <input type="text" id="pwdInput" class="pwd-input" placeholder="YYYYMMDD" maxlength="8">
        <div>
            <button class="submit-btn" onclick="checkPassword()">確認</button>
            <button class="close-btn" style="background-color: #DDD; border-color: #999; box-shadow: 0 4px 0 #999;" onclick="closeModal('questionModal')">取消</button>
        </div>
    </div>
</div>

<!-- 彈窗 3：信件 Window 彈窗 -->
<div class="modal" id="letterModal">
    <div class="modal-content" style="padding: 20px;">
        <div class="letter-content">
            <div class="letter-title">✉️ 給 Alby 的一封信</div>
            親愛的 Alby：<br><br>
            祝你生日快樂！🎂✨<br>
            希望你今日順順利利、過得開開心心！<br>
            上 Lecture 唔好成日悶到訓教啦，哈哈！🤣<br>
            記住要多啲飲水，好好照顧自己。不論何時，You are not alone！<br><br>
            <span style="float: right; font-weight: bold; color: #4A6B70;">來自你的 AI 夥伴 🫶🏻</span>
            <div style="clear: both;"></div>
        </div>
        <br>
        <button class="close-btn" onclick="closeModal('letterModal')">收好信件</button>
    </div>
</div>

<script>
    const gachaResults = [
        "希望你今日順順利利 過得好好🫶🏻✨",
        "有時唔洗咁小心講嘢 擔心人地唔開心!!!😠",
        "訓教教主今日訓夠未!!😆",
        "今日嘅Alby做得好好 叻女✨",
        "上lec 係咪好悶🤧 我以前會忍唔住訓🤣",
        "提提你記得見字飲水 健康好重要😤",
        "有咩事 隨時可以搵我傾計～😬",
        "🪄🪄🪄 幫你叉電🪫->🔋",
        "You are not alone(^^) ",
    ];

    const starImages = ['star.png', 'star2.png', 'star3.png', 'star4.png'];
    const starContainer = document.getElementById('starContainer');
    
    function initStars() {
        starContainer.innerHTML = '';
        const containerWidth = 240;
        const containerHeight = 200;
        const starSize = 34; 
        const cols = 6;
        const rows = 5;
        const cellWidth = containerWidth / cols;   
        const cellHeight = 32;                     
        const topPadding = 35;                     

        let grids = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                grids.push({ row: r, col: c });
            }
        }
        grids.sort(() => Math.random() - 0.5);

        for (let i = 0; i < grids.length; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'star-wrapper';
            const starImg = document.createElement('img');
            starImg.className = 'star-img';
            
            const randomImgSrc = starImages[Math.floor(Math.random() * starImages.length)];
            starImg.src = randomImgSrc; 

            const cell = grids[i];
            const baseX = cell.col * cellWidth;
            const baseY = cell.row * cellHeight + topPadding; 

            const offsetX = Math.random() * (cellWidth - starSize + 4);
            const offsetY = Math.random() * (cellHeight - starSize + 4);

            const posX = Math.max(2, Math.min(containerWidth - starSize - 2, baseX + offsetX));
            const posY = Math.max(5, Math.min(containerHeight - starSize - 5, baseY + offsetY));
            const rotate = Math.random() * 360; 
            
            wrapper.style.left = `${posX}px`;
            wrapper.style.top = `${posY}px`;
            wrapper.style.setProperty('--base-rot', `${rotate}deg`);
            
            wrapper.style.setProperty('--roll-deg1', `${Math.random() * 180 - 90}deg`);
            wrapper.style.setProperty('--roll-deg2', `${Math.random() * 360 - 180}deg`);
            wrapper.style.setProperty('--roll-deg3', `${Math.random() * 540 - 270}deg`);
            wrapper.style.setProperty('--shake-x1', `${Math.random() * 50 - 25}px`);
            wrapper.style.setProperty('--shake-y1', `${Math.random() * -50 - 20}px`);
            wrapper.style.setProperty('--shake-x2', `${Math.random() * 60 - 30}px`);
            wrapper.style.setProperty('--shake-y2', `${Math.random() * -40 - 40}px`);
            wrapper.style.setProperty('--shake-x3', `${Math.random() * 50 - 25}px`);
            wrapper.style.setProperty('--shake-y3', `${Math.random() * -30 - 10}px`);

            const randomSpeed = 0.3 + Math.random() * 0.2;
            wrapper.style.setProperty('--speed', `${randomSpeed}s`);
            const randomDelay = Math.random() * -0.4;
            wrapper.style.setProperty('--delay', `${randomDelay}s`);
            
            starImg.style.animationDelay = `${Math.random() * -3}s`;
            wrapper.appendChild(starImg);
            starContainer.appendChild(wrapper);
        }
    }

    initStars();

    let isPlaying = false; 

    function drawGacha() {
        if (isPlaying) return;
        isPlaying = true;

        const knob = document.getElementById('knob');
        const machine = document.getElementById('machine');
        const gachaBall = document.getElementById('gachaBall');
        const resultImg = document.getElementById('resultImg');

        const luckyStar = starImages[Math.floor(Math.random() * starImages.length)];
        gachaBall.src = luckyStar;
        resultImg.src = luckyStar;

        gachaBall.classList.remove('drop');
        knob.classList.add('rotate');

        setTimeout(() => { machine.classList.add('shaking'); }, 200);

        setTimeout(() => {
            machine.classList.remove('shaking');
            knob.classList.remove('rotate');
            gachaBall.classList.add('drop'); 
        }, 1500);

        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * gachaResults.length);
            const finalResult = gachaResults[randomIndex];
            document.getElementById('resultText').innerText = finalResult;
            openModal('resultModal');
        }, 2100);
    }

    function openQuestionWindow() {
        document.getElementById('pwdInput').value = ''; 
        openModal('questionModal');
    }

    function checkPassword() {
        const input = document.getElementById('pwdInput').value.trim();
        if (input === '20260610') {
            closeModal('questionModal'); 
            setTimeout(() => {
                openModal('letterModal'); 
            }, 300);
        } else {
            alert('密碼錯誤❌ 再試試看吧！');
        }
    }

    function openModal(id) {
        const modal = document.getElementById(id);
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('show'), 10);
    }

    function closeModal(id) {
        const modal = document.getElementById(id);
        modal.classList.remove('show');
        setTimeout(() => {
            modal.style.display = 'none';
            if(id === 'resultModal') {
                document.getElementById('gachaBall').classList.remove('drop');
                isPlaying = false;
                initStars(); 
            }
        }, 300);
    }
</script>

</body>
</html>
