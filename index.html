<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星星扭蛋機</title>
    <style>
    body {
            margin: 0;
            padding: 0;
            background-image: url('bg.png'); 
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;    
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        /* 扭蛋機外殼 */
        .gachapon-machine {
            width: 280px;
            height: 400px;
            background-color: #FF6B81;
            border-radius: 20px 20px 10px 10px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 5px solid #333;
        }

        /* 上半部：透明櫥窗（裝星星） */
        .showcase {
            width: 240px;
            height: 200px;
            background-color: #E0FFFF;
            border: 5px solid #333;
            border-radius: 15px;
            margin: 15px auto 0;
            position: relative;
            overflow: hidden;
            background-image: radial-gradient(circle, rgba(255,255,255,0.8) 20%, transparent 20%);
            background-size: 20px 20px;
        }

        /* 櫥窗內的星星群 */
        .star-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* ─── 核心修改：基本星星樣式與平時的浮動動畫 ─── */
        .star-item {
            position: absolute;
            width: 38px;  
            height: auto;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
            /* 平時沒抽獎時，讓它們微微浮動自轉，更有生命力 */
            animation: idleFloat 3s ease-in-out infinite alternate;
        }

        /* 平時微動的動畫效果 */
        @keyframes idleFloat {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-8px) rotate(5deg); }
        }

        /* ─── 核心修改：抽獎時「瘋狂亂滾彈跳」的 CSS 動畫 ─── */
        @keyframes gachaRoll {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            15% { transform: translate(-20px, -60px) rotate(-90deg) scale(1.1); }
            30% { transform: translate(25px, -110px) rotate(180deg) scale(0.9); }
            45% { transform: translate(-30px, -40px) rotate(270deg) scale(1.05); }
            60% { transform: translate(35px, -90px) rotate(90deg) scale(0.95); }
            75% { transform: translate(-15px, -120px) rotate(360deg) scale(1.1); }
            90% { transform: translate(20px, -30px) rotate(180deg) scale(1); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        /* 當 JS 為機器加上 .shaking 類別時，星星立刻切換成瘋狂亂滾動畫 */
        .shaking .star-item {
            /* 覆蓋掉原本的 idleFloat，改播 gachaRoll */
            animation: gachaRoll 0.4s ease-in-out infinite;
        }

        /* 下半部：控制區與出蛋口 */
        .control-panel {
            width: 100%;
            position: absolute;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 扭蛋機旋鈕 */
        .knob {
            width: 60px;
            height: 60px;
            background-color: #FFF;
            border: 4px solid #333;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: transform 0.5s ease;
            box-shadow: 0 4px 0 #CCC;
        }

        .knob::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 12px;
            background-color: #333;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            border-radius: 4px;
        }

        .knob.rotate {
            transform: rotate(360deg);
        }

        /* 出蛋口 */
        .exit-hole {
            width: 70px;
            height: 50px;
            background-color: #333;
            border-radius: 15px 15px 0 0;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 出來的扭蛋 */
        .gacha-ball {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #FF4500 50%, #FFF 50%);
            border: 2px solid #333;
            position: absolute;
            top: -40px;
            left: 18px;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gacha-ball.drop {
            top: 10px;
        }

        /* 彈出彈跳視窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: #FFF;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 80%;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .result-star {
            width: 80px;      
            height: auto;
            animation: spin 2s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .result-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .close-btn {
            background-color: #FF6B81;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #D84357;
        }

        .close-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #D84357;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="gachapon-machine" id="machine">
        <div class="showcase">
            <div class="star-container" id="starContainer"></div>
        </div>

        <div class="control-panel">
            <div class="knob" id="knob" onclick="drawGacha()"></div>
            
            <div class="exit-hole">
                <div class="gacha-ball" id="gachaBall"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="resultModal">
    <div class="modal-content">
        <img src="star.png" class="result-star" alt="star">
        <div class="result-text" id="resultText">恭喜獲得：???</div>
        <button class="close-btn" onclick="closeModal()">太棒了！</button>
    </div>
</div>

<script>
    const gachaResults = [
        "希望你今日順順利利 過得好好🫶🏻✨",
        "有時唔洗咁小心講嘢 擔心人地唔開心!!!😠",
        "訓教教主今日訓夠未!!😆",
        "今日嘅Alby做得好好 叻女✨",
        "上lec 係咪好悶🤧 我以前會忍唔住訓🤣",
        "提提你記得見字飲水 健康好重要😤",
        "有咩事 隨時可以搵我傾計～😬",
        "🪄🪄🪄 幫你叉電🪫->🔋",
        "You are not alone(^^) ",
    ];

    const starContainer = document.getElementById('starContainer');
    
    function initStars() {
        starContainer.innerHTML = '';
        for (let i = 0; i < 18; i++) {
            const star = document.createElement('img');
            star.className = 'star-item';
            star.src = 'star.png'; 
            
            const posX = Math.random() * 190 + 5;
            const posY = Math.random() * 110 + 45; // 稍微下調初始位置，讓上方有空間彈跳
            const rotate = Math.random() * 60 - 30; 
            
            star.style.left = `${posX}px`;
            star.style.top = `${posY}px`;
            star.style.transform = `rotate(${rotate}deg)`;
            
            // ─── 核心修改：為每隻星星隨機加上些許動畫延遲(delay)，讓它們飄浮時錯開，看起來更自然 ───
            star.style.animationDelay = `${Math.random() * -3}s`;
            
            starContainer.appendChild(star);
        }
    }

    initStars();

    let isPlaying = false; 

    function drawGacha() {
        if (isPlaying) return;
        isPlaying = true;

        const knob = document.getElementById('knob');
        const machine = document.getElementById('machine');
        const gachaBall = document.getElementById('gachaBall');

        gachaBall.classList.remove('drop');
        knob.classList.add('rotate');

        setTimeout(() => {
            machine.classList.add('shaking'); // 這裡一加上去，CSS 就會驅動機器震動 + 星星狂滾
        }, 200);

        setTimeout(() => {
            machine.classList.remove('shaking');
            knob.classList.remove('rotate');
            gachaBall.classList.add('drop');
        }, 1500);

        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * gachaResults.length);
            const finalResult = gachaResults[randomIndex];

            document.getElementById('resultText').innerText = finalResult;
            
            const modal = document.getElementById('resultModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }, 2100);
    }

    function closeModal() {
        const modal = document.getElementById('resultModal');
        modal.classList.remove('show');
        
        setTimeout(() => {
            modal.style.display = 'none';
            document.getElementById('gachaBall').classList.remove('drop');
            isPlaying = false;
            initStars(); 
        }, 300);
    }
</script>

</body>
</html>
